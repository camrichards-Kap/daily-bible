    --line: #2A332F; --accent: #8DBFAC; --on-accent: #0F1A16; --accent-soft: #1F2D28;
    --mark: #6B5A1E; --mark-fg: #FFF7DA;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111614; --surface: #1A211E; --fg: #E7ECE9; --muted: #93A099;
  --line: #2A332F; --accent: #8DBFAC; --on-accent: #0F1A16; --accent-soft: #1F2D28;
  --mark: #6B5A1E; --mark-fg: #FFF7DA;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--fg);
  font: 400 16px/1.5 var(--ui);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--bg);
}
main {
  max-width: 560px; margin: 0 auto;
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
  padding-block: calc(env(safe-area-inset-top, 0px) + 24px) calc(env(safe-area-inset-bottom, 0px) + 120px);
  display: flex; flex-direction: column; gap: 22px;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 8px; }

/* Day header */
.day { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.day-text { min-width: 0; }
.eyebrow {
  margin: 0; font-size: 12px; font-weight: 600; letter-spacing: .08em;
  text-transform: uppercase; color: var(--muted); font-variant-numeric: tabular-nums;
}
.date { margin: 4px 0 0; font: 600 26px/1.15 var(--display); text-wrap: balance; }
.nav { display: flex; gap: 6px; flex: none; }
.icon-btn {
  width: 40px; height: 40px; border-radius: 50%;
  border: 1px solid var(--line); background: var(--surface);
  display: grid; place-items: center; cursor: pointer;
}
.icon-btn svg { width: 18px; height: 18px; }
.today-link {
  align-self: flex-start; margin-top: -12px;
  background: none; border: 0; padding: 0; cursor: pointer;
  color: var(--accent); font-size: 14px; font-weight: 500;
}

/* Readings summary */
.readings { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.reading { background: var(--surface); padding: 14px 16px; display: grid; gap: 2px; min-width: 0; }
.reading .eyebrow { font-size: 11px; }
.ref { margin: 0; font: 500 18px/1.25 var(--display); }
.reading.active .ref { color: var(--accent); }

/* Settings */
details { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding-block: 14px; }
summary {
  list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center;
  font-size: 14px; font-weight: 500; color: var(--muted);
}
summary::-webkit-details-marker { display: none; }
summary .cur { color: var(--fg); }
.settings { display: grid; gap: 20px; margin-top: 16px; }
.field { display: grid; gap: 8px; }
.label { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.seg { display: flex; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 3px; }
.seg label { flex: 1; position: relative; }
.seg input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.seg span {
  display: block; text-align: center; padding: 8px 2px; white-space: nowrap; border-radius: 9px;
  font-size: 14px; font-weight: 500; color: var(--muted);
}
.seg input:checked + span { background: var(--accent); color: var(--on-accent); }
.seg input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.hint { margin: 0; font-size: 13px; color: var(--muted); }
select, input[type="text"] {
  width: 100%; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--surface); color: var(--fg); font: 400 15px var(--ui);
}

/* Passage text */
.text { font: 400 var(--text-size)/1.7 var(--display); }
.text h2 {
  margin: 28px 0 10px; font: 600 13px/1.3 var(--ui); letter-spacing: .08em;
  text-transform: uppercase; color: var(--muted);
}
.text h2:first-child { margin-top: 4px; }
.text h3 { margin: 22px 0 6px; font: 600 1.15em/1.3 var(--display); border-radius: 6px; scroll-margin: 40vh; }
.text h3.cur { color: var(--accent); }
.v { margin: 0 0 .55em; border-radius: 8px; padding: 2px 6px; margin-inline: -6px; cursor: pointer; scroll-margin: 40vh; transition: background .2s; }
.v sup { font: 600 .6em var(--ui); color: var(--muted); margin-right: .35em; vertical-align: .55em; font-variant-numeric: tabular-nums; }
.v.cur { background: var(--accent-soft); }
.w { border-radius: 4px; }
.w.on { background: var(--mark); color: var(--mark-fg); box-shadow: 0 0 0 2px var(--mark); }
.note { margin: 0; font: 400 15px/1.55 var(--ui); color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
.note strong { color: var(--fg); font-weight: 600; }
.note ol { margin: 10px 0 0; padding-left: 20px; display: grid; gap: 4px; }
.note a { color: var(--accent); }
.text-foot { margin-top: 24px; font: 400 12px/1.5 var(--ui); color: var(--muted); text-align: center; }
.text-foot a { color: var(--accent); }
.version { margin: 0; font-size: 11px; color: var(--muted); text-align: center; }
.test-btn { justify-self: start; padding: 9px 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-size: 14px; font-weight: 500; cursor: pointer; }
.text .note { margin: 0 0 .8em; }

/* Bottom player */
.player {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  border-top: 1px solid var(--line);
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
}
.bar { height: 3px; background: var(--line); }
.bar > i { display: block; height: 100%; width: 0%; background: var(--accent); transition: width .3s linear; }
.player-row {
  max-width: 560px; margin: 0 auto; padding-top: 12px;
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
  display: flex; align-items: center; gap: 14px;
}
.play {
  flex: none; width: 58px; height: 58px; border-radius: 50%; border: 0; cursor: pointer;
  background: var(--accent); color: var(--on-accent);
  display: grid; place-items: center; transition: transform .15s ease;
}
.play:active { transform: scale(.95); }
.play svg { width: 24px; height: 24px; }
.play[aria-busy="true"] svg { opacity: .35; }
.status { min-width: 0; flex: 1; display: grid; gap: 1px; }
.status-main { font-weight: 600; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.status-sub { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.msg { margin: 0; font-size: 14px; background: var(--accent-soft); padding: 10px 14px; border-radius: 10px; }
.done-chip { color: var(--accent); }
@media (max-width: 380px) { .readings { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>
</head>

      }
      let off = 0, meta = null;
      if (tr !== "esv") {
        const w = v => v[1].length + 10, pre = verses.filter(v => v[0] < f).reduce((a, v) => a + w(v), 0) + 18;
        meta = metas[si] = { b, c, f, t, pre, tot: verses.reduce((a, v) => a + w(v), 0) + 18, last: verses[verses.length - 1][0] };
        off = f > 1 ? pre : 0;
      }
      const h3 = document.createElement("h3"); h3.textContent = headingText(b, c) + (f > 1 || (tr !== "esv" && t < verses.length) ? `:${f}–${t}` : "");
      frag.append(h3);
      q.push({ which, label: part[0], text: spokenHeading(b, c, f), el: h3, words: [], where: headingText(b, c), si, wt: 18, off });
      if (f === 1) off += 18;
      for (const [v, text] of verses) {
        if (v < f || v > t || !text) continue;
        const p = document.createElement("p"); p.className = "v"; p.dataset.i = q.length;
        const sup = document.createElement("sup"); sup.textContent = v; p.append(sup);
        const words = []; let pos = 0;
        for (const tok of text.split(/(\s+)/)) {
          if (!tok) continue;
          if (/^\s+$/.test(tok)) { p.append(tok); }
          else { const s = document.createElement("span"); s.className = "w"; s.textContent = tok; p.append(s); words.push({ start: pos, end: pos + tok.length, el: s }); }
          pos += tok.length;
        }
        q.push({ which, label: part[0], text, el: p, words, where: `${headingText(b, c)}:${v}`, si, wt: text.length + 10, off });
        off += text.length + 10;
        frag.append(p);
      }
      if (meta) meta.endOff = off;
    }
  }
  const foot = document.createElement("p"); foot.className = "text-foot";
  if (tr === "esv") foot.innerHTML = 'ESV · Scripture quotations are from the ESV® Bible (The Holy Bible, English Standard Version®), © 2001 by Crossway, a publishing ministry of Good News Publishers. Used by permission. All rights reserved. The ESV text may not be quoted in any publication made available to the public by a Creative Commons license. The ESV may not be translated into any other language. Users may not copy or download more than 500 verses of the ESV Bible or more than one half of any book of the ESV Bible. <a href="https://www.esv.org" target="_blank" rel="noopener">www.esv.org</a>';
  else foot.textContent = tr === "kjv" ? "King James Version · public domain" : "World English Bible · public domain";
  frag.append(foot);
  return { q, frag, metas };
}
function loadText() {
  const id = ++loadId;
  const art = $("text");
  queue = []; qi = 0; queuePromise = null; lastWord = lastItem = null;
  if (settings.tr === "esv" && !settings.key.trim()) {
    art.innerHTML = '<div class="note"><strong>The ESV audio is ready. Tap play.</strong> To also read along in ESV, add a free key from Crossway:<ol><li>Go to <a href="https://api.esv.org/account/create-application/" target="_blank" rel="noopener">api.esv.org</a> and create a free account.</li><li>Create an API application. Personal, non-commercial use is free.</li><li>Copy the key it gives you.</li><li>Open Settings here and paste it under ESV text key.</li></ol></div>';
    return;
  }
  art.innerHTML = '<p class="note">Loading the text…</p>';
  const tr = settings.tr;
  queuePromise = buildQueue(tr).then(({ q, frag, metas }) => {
    if (id !== loadId) return null;
    art.replaceChildren(frag);
    queue = q; qi = 0; segMeta = metas; ri = 0; recLoaded = false;
    if (tr === "esv") buildTimeline();
    return q;
  }).catch(e => {
    if (id !== loadId) return null;
    if (tr === "esv") {
      art.innerHTML = e.message === "key"
        ? '<p class="note"><strong>Crossway didn\'t accept that key.</strong> Check it in Settings under ESV text key. The audio still plays.</p>'
        : '<p class="note"><strong>Couldn\'t load the ESV text.</strong> Check your connection and reopen the app. The audio still plays.</p>';
      queuePromise = null; return null;
    }
    art.innerHTML = '<p class="note"><strong>Couldn\'t load the text.</strong> The app\'s text folder may not have been uploaded with it. Upload the whole daily-bible.zip, not just index.html.</p>';
    queuePromise = null;
    return null;
  });
}
function clearMarks() {
  if (lastWord) lastWord.el.classList.remove("on");
  if (lastItem) lastItem.el.classList.remove("cur");
  lastWord = lastItem = null;
}
function follow(el) {
  if (Date.now() - lastUserScroll < 5000) return; // let the reader scroll around without being yanked back
  const r = el.getBoundingClientRect();
  const bottomLimit = window.innerHeight - 140;
  if (r.top < 60 || r.bottom > bottomLimit) el.scrollIntoView({ block: "center", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
}
["touchmove", "wheel"].forEach(ev => addEventListener(ev, () => lastUserScroll = Date.now(), { passive: true }));

/* ---------- KJV / WEB: phone voice ---------- */
function pickVoice() {
  const vs = speechSynthesis.getVoices();
  if (settings.voice) return vs.find(v => v.voiceURI === settings.voice) || null;
  if (!forceVoice) return null;                       // "Phone default" leaves the choice to the phone
  const en = vs.filter(v => v.lang && v.lang.replace("_", "-").startsWith("en"));
  return en.find(v => /samantha/i.test(v.name)) || en.find(v => v.lang.replace("_", "-") === "en-US") || en[0] || null;
}
function speakNext(id) {
  if (id !== runId || !playing) return;
  if (qi >= queue.length) { playing = false; setButton(); releaseWake(); markDone(); qi = 0; return; }
  const item = queue[qi];
  clearMarks();
  item.el.classList.add("cur"); lastItem = item;
  follow(item.el);
  highlightBox(item.which);
  setStatus(item.label, `${item.where} · ${Math.round(qi / queue.length * 100)}%`, qi / queue.length * 100);
  utter = new SpeechSynthesisUtterance(item.text);
  const v = pickVoice(); if (v) { utter.voice = v; utter.lang = v.lang; } else utter.lang = "en-US";
  utter.rate = settings.rate;
  const mark = charIndex => {
    let w = null;
    for (const x of item.words) { if (x.start <= charIndex) w = x; else break; }
    if (!w || w === lastWord) return;
    if (lastWord) lastWord.el.classList.remove("on");
    w.el.classList.add("on"); lastWord = w;
    follow(w.el);
  };
  let started = 0, sawBoundary = false;
  clearInterval(tick);
  utter.onstart = () => { started = performance.now(); heard = true; };
  utter.onboundary = e => {
    if (id !== runId || (e.name && e.name !== "word") || !item.words.length) return;
    sawBoundary = true; heard = true; mark(e.charIndex);
  };
  if (item.words.length) tick = setInterval(() => {
    if (id !== runId || !playing) { clearInterval(tick); return; }
    if (sawBoundary) return;                       // the voice is telling us where it is
    if (!started) started = performance.now();     // some phones never send a start event
    mark((performance.now() - started) / 1000 * cps * settings.rate);
  }, 90);
  utter.onend = () => {
    clearInterval(tick); heard = true;
    if (started && item.text.length > 40) {         // learn this voice's real pace for the estimate
      const secs = (performance.now() - started) / 1000;
      if (secs > 1) cps = Math.min(24, Math.max(8, cps * .6 + (item.text.length / secs / settings.rate) * .4));
    }
    if (id === runId && playing) { qi++; speakNext(id); }
  };
  utter.onerror = e => {
    clearInterval(tick);
    if (id !== runId || !playing || e.error === "interrupted" || e.error === "canceled") return;
    if (!heard) { stopAll(false); showMsg(`This phone refused to speak (reason: ${e.error || "unknown"}). Open Settings and tap Test voice, or switch to ESV.`); return; }
    qi++; speakNext(id);
  };
  speechSynthesis.speak(utter);
}
async function playSpeech() {
  if (!("speechSynthesis" in window)) { showMsg("This browser can't read aloud. Switch to ESV in Settings."); return; }
  const id = ++runId;
  if (!queue.length) {
    if (!queuePromise) loadText();
    loading = true; setButton(); setStatus("Loading text…", "", null);
    await queuePromise;
    loading = false; setButton();
    if (id !== runId) return;
    if (!queue.length) { idleStatus(); showMsg("Couldn't load the text. Check your connection and tap play again."); return; }
  }
  lastUserScroll = 0;
  playing = true; setButton(); requestWake();
  startSpeaking(id);
}
function startSpeaking(id) {
  heard = false;
  setTimeout(() => {
    if (id !== runId || !playing || heard) return;
    if (!forceVoice && !settings.voice) {              // the phone accepted the request but never started: try a named voice
      forceVoice = true;
      try { speechSynthesis.cancel(); } catch {}
      setTimeout(() => { if (id === runId && playing) speakNext(id); }, 150);
      setTimeout(() => { if (id === runId && playing && !heard) showMsg("This phone isn't starting its voice here. Open Settings and tap Test voice to see why."); }, 3500);
    } else showMsg("This phone isn't starting its voice here. Open Settings and tap Test voice to see why.");
  }, 2500);
  if (speechSynthesis.speaking || speechSynthesis.pending) {
    speechSynthesis.cancel();
    setTimeout(() => speakNext(id), 120);              // iPhone drops speech that starts in the same instant as a cancel
  } else speakNext(id);                                 // start right inside the tap, which iPhone requires
}
async function requestWake() { try { wakeLock = await navigator.wakeLock?.request("screen"); } catch {} }
function releaseWake() { try { wakeLock?.release(); } catch {} wakeLock = null; }

// Tap a verse to read from there
$("text").addEventListener("click", e => {
  const p = e.target.closest(".v"); if (!p || !queue.length) return;
  const i = +p.dataset.i;
  if (settings.tr === "esv") {
    if (audio.duration && queue[i].t0 != null) { audio.currentTime = queue[i].t0; if (!playing) playEsv(); }
    else { pendingSeek = i; if (!playing) playEsv(); }
    return;
  }
  if (recorded()) {
    const it = queue[i]; lastUserScroll = 0;
    if (it.si === ri && recLoaded && segMeta[ri].timed) { audio.currentTime = it.t0; if (!playing) recWatch(audio.play()); }
    else recWatch(recLoad(it.si, it));
    return;
  }
  qi = i;
  clearMarks(); p.classList.add("cur"); lastItem = queue[qi];
  if (playing) startSpeaking(++runId);
  else playSpeech();
});

/* ---------- ESV: Crossway audio ---------- */
const code = (b, c, v) => String(b + 1).padStart(2, "0") + String(c).padStart(3, "0") + String(v).padStart(3, "0");
function esvUrl() {
  const segs = [...entry[1][1], ...entry[2][1]];
  return "https://audio.esv.org/hw/" + segs.map(([b, c, f, t]) => code(b, c, f) + "-" + code(b, c, t)).join(",") + ".mp3";
}
function otShare() {
  const n = s => s.reduce((a, x) => a + (x[3] - x[2] + 1), 0);
  const o = n(entry[1][1]), t = n(entry[2][1]);
  return o / (o + t);
}
function playEsv() {
  const url = esvUrl();
  if (audio.dataset.url !== url) { audio.src = url; audio.dataset.url = url; }
  audio.playbackRate = settings.rate;
  loading = true; setButton();
  audio.play().then(() => {
    loading = false; playing = true; setButton(); lastUserScroll = 0;
    probeDurations(url);
    if ("mediaSession" in navigator) {
      navigator.mediaSession.metadata = new MediaMetadata({ title: `${entry[1][0]} · ${entry[2][0]}`, artist: `ESV · Day ${entry[0]}`, album: "Daily Bible" });
    }
  }).catch(() => {
    loading = false; playing = false; setButton();
    showMsg("The ESV audio didn't load. Check your connection, or switch to KJV in Settings.");
  });
}
// Work out roughly when each verse starts in the recording. The recording has no verse timings,
// so time is shared out by verse length, pinned to the real length of each chapter when we can get it.
function buildTimeline() {
  if (!queue.length || settings.tr !== "esv") return;
  if (playing && audio.dataset.url) probeDurations(audio.dataset.url);
  if (!audio.duration) return;
  const nSeg = queue[queue.length - 1].si + 1, wSeg = Array(nSeg).fill(0);
  for (const it of queue) wSeg[it.si] += it.wt;
  const total = wSeg.reduce((a, b) => a + b, 0);
  let dur = wSeg.map(w => w / total * audio.duration);
  if (segDur && segDur.length === nSeg && segDur.every(d => d > 0)) {
    const sum = segDur.reduce((a, b) => a + b, 0);
    if (Math.abs(sum - audio.duration) / audio.duration < .08) dur = segDur.map(d => d / sum * audio.duration);
  }
  const start = []; dur.reduce((a, d, i) => (start[i] = a, a + d), 0);
  const used = Array(nSeg).fill(0);
  for (const it of queue) { it.t0 = start[it.si] + used[it.si] / wSeg[it.si] * dur[it.si]; used[it.si] += it.wt; }
  if (pendingSeek >= 0 && queue[pendingSeek]) { audio.currentTime = queue[pendingSeek].t0; pendingSeek = -1; }
}
function probeDurations(url) {
  if (segDur || probing === url || !queue.length) return;
  probing = url;
  const segs = [...entry[1][1], ...entry[2][1]];
  if (segs.length < 2) return;
  Promise.all(segs.map(([b, c, f, t]) => new Promise(res => {
    const a = new Audio(); a.preload = "metadata";
    const done = v => { a.removeAttribute("src"); res(v); };
    a.onloadedmetadata = () => done(a.duration); a.onerror = () => done(0);
    setTimeout(() => done(0), 10000);
    a.src = "https://audio.esv.org/hw/" + code(b, c, f) + "-" + code(b, c, t) + ".mp3";
  }))).then(d => { if (audio.dataset.url === url) { segDur = d; buildTimeline(); } });
}
audio.addEventListener("loadedmetadata", buildTimeline);
audio.addEventListener("durationchange", buildTimeline);
audio.addEventListener("timeupdate", () => {
  if (audio.dataset.url === "rec") { recTick(); return; }
  if (!audio.duration || settings.tr !== "esv") return;
  const p = audio.currentTime / audio.duration, ot = p < otShare();
  let where = "";
  if (queue.length && queue[0].t0 != null) {
    let it = queue[0];
    for (const x of queue) { if (x.t0 <= audio.currentTime + .15) it = x; else break; }
    if (it !== lastItem) { clearMarks(); it.el.classList.add("cur"); lastItem = it; if (playing) follow(it.el); }
    highlightBox(it.which); where = it.where + " · ";
    setStatus(it.label, `${where}${fmt(audio.currentTime)} / ${fmt(audio.duration)}`, p * 100);
    return;
  }
  highlightBox(ot ? "ot" : "nt");
  setStatus(ot ? entry[1][0] : entry[2][0], `${fmt(audio.currentTime)} / ${fmt(audio.duration)}`, p * 100);
});
audio.addEventListener("ended", () => {
  if (audio.dataset.url === "rec") { recNext(); return; }
  playing = false; setButton(); markDone();
});
audio.addEventListener("error", () => {
  if (audio.dataset.url === "rec") { recError(); return; }
  if (!audio.dataset.url) return;
  playing = false; loading = false; setButton();
  showMsg("The ESV audio didn't load. Check your connection, or switch to KJV in Settings.");
});

/* ---------- KJV: recorded narration, one recording per chapter ---------- */
function recLoad(i, item) {
  ri = i; recSeekItem = item || null; recLoaded = true;
  const m = segMeta[i]; m.timed = false;
  audio.dataset.url = "rec";
  audio.src = REC_BASES[recBase] + (m.b + 1) + "/" + m.c + ".mp3";
  audio.playbackRate = settings.rate;
  return audio.play();
}
function recWatch(p) {
  loading = !playing; setButton();
  p.then(() => {
    loading = false; playing = true; setButton();
    if ("mediaSession" in navigator) navigator.mediaSession.metadata = new MediaMetadata({ title: `${entry[1][0]} · ${entry[2][0]}`, artist: `KJV · Day ${entry[0]}`, album: "Daily Bible" });
  }).catch(() => { loading = false; setButton(); });
}
function playRec() {
  if (!queue.length) { showMsg("The text is still loading. Tap play again in a moment."); return; }
  lastUserScroll = 0;
  recWatch(recLoaded && audio.getAttribute("src") ? audio.play() : recLoad(ri));
}
// Each chapter recording has no verse timings, so share its length out by verse length
function recTimes() {
  const m = segMeta[ri], d = audio.duration; if (!m || !d || !isFinite(d)) return;
  for (const it of queue) if (it.si === ri) it.t0 = d * it.off / m.tot;
  m.start = m.f > 1 ? Math.max(0, d * m.pre / m.tot - 1) : 0;           // readings that start mid-chapter
  m.end = m.t < m.last ? Math.min(d, d * m.endOff / m.tot + 1.5) : d + 1;  // readings that stop mid-chapter
  const target = recSeekItem ? recSeekItem.t0 : m.start; recSeekItem = null;
  if (!m.timed && target > .3) audio.currentTime = target;
  m.timed = true; audio.playbackRate = settings.rate;
}
function recNext() {
  if (ri + 1 < segMeta.length) { recWatch(recLoad(ri + 1)); return; }
  playing = false; recLoaded = false; ri = 0; audio.pause(); setButton(); markDone();
}
function recTick() {
  const m = segMeta[ri]; if (!m || !m.timed) return;
  const ct = audio.currentTime, d = audio.duration;
  if (ct >= m.end) { recNext(); return; }
  let it = null;
  for (const x of queue) { if (x.si !== ri) continue; if (it === null || x.t0 <= ct + .15) it = x; else break; }
  if (!it) return;
  if (it !== lastItem) { clearMarks(); it.el.classList.add("cur"); lastItem = it; if (playing) follow(it.el); }
  highlightBox(it.which);
  const frac = Math.min(1, Math.max(0, (ct - m.start) / Math.max(1, Math.min(m.end, d) - m.start)));
  const pct = (ri + frac) / segMeta.length * 100;
  setStatus(it.label, `${it.where} · ${Math.round(pct)}%`, pct);
}
function recError() {
  if (recBase + 1 < REC_BASES.length) {          // try the recording's second address
    recBase++; const wasPlaying = playing || loading;
    if (wasPlaying) recWatch(recLoad(ri, recSeekItem)); else recLoaded = false;
    return;
  }
  recFailed = true; playing = false; loading = false; recLoaded = false;
  audio.removeAttribute("src"); delete audio.dataset.url;
  setButton(); renderSettings();
  showMsg("The recorded KJV narration couldn't be reached, so KJV will use your phone's voice. Tap play to start.");
}
audio.addEventListener("loadedmetadata", () => { if (audio.dataset.url === "rec") recTimes(); });
audio.addEventListener("durationchange", () => { if (audio.dataset.url === "rec") recTimes(); });
audio.addEventListener("playing", () => { audio.playbackRate = settings.rate; });

/* ---------- controls ---------- */
function stopAll(reset) {
  runId++;
  playing = false; loading = false;
  try { speechSynthesis.cancel(); } catch {}
  clearInterval(tick);
  audio.pause();
  releaseWake();
  if (reset) { recLoaded = false; ri = 0; segDur = null; pendingSeek = -1; probing = ""; audio.removeAttribute("src"); delete audio.dataset.url; audio.load(); }
  setButton();
}
$("play").addEventListener("click", () => {
  if (loading) return;
  showMsg("");
  if (playing) { stopAll(false); return; }   // pause; KJV/WEB resumes at the current verse
  settings.tr === "esv" ? playEsv() : recorded() ? playRec() : playSpeech();
});
function goTo(d) { stopAll(true); current = d; render(); scrollTo(0, 0); }
$("prev").addEventListener("click", () => { manualDay = true; const d = new Date(current); d.setDate(d.getDate() - 1); goTo(d); });
$("next").addEventListener("click", () => { manualDay = true; const d = new Date(current); d.setDate(d.getDate() + 1); goTo(d); });
$("toToday").addEventListener("click", () => { manualDay = false; goTo(new Date()); });

document.querySelectorAll('input[name="tr"]').forEach(r => r.addEventListener("change", () => {
  settings.tr = r.value; store.set("tr", r.value); stopAll(true); render(); renderSettings();
}));
document.querySelectorAll('input[name="sp"]').forEach(r => r.addEventListener("change", () => {
  settings.rate = parseFloat(r.value); store.set("rate", settings.rate);
  audio.playbackRate = settings.rate; renderSettings();
}));
document.querySelectorAll('input[name="sz"]').forEach(r => r.addEventListener("change", () => {
  settings.size = parseInt(r.value, 10); store.set("size", settings.size); renderSettings();
}));
document.querySelectorAll('input[name="na"]').forEach(r => r.addEventListener("change", () => {
  settings.narr = r.value; store.set("narr", r.value);
  if (r.value === "rec") { recFailed = false; recBase = 0; }
  stopAll(true); render(); renderSettings();
}));
$("esvKey").addEventListener("change", e => {
  settings.key = e.target.value.trim(); store.set("esvKey", settings.key); esvDay = null;
  if (settings.tr === "esv") loadText();
});
// Speaks one sentence and reports exactly what the phone did, so a silent voice can be diagnosed
$("testVoice").addEventListener("click", () => {
  const out = $("testOut"); out.hidden = false;
  if (!("speechSynthesis" in window)) { out.textContent = "Result A: this browser has no voice feature at all."; return; }
  stopAll(false);
  const all = speechSynthesis.getVoices(), en = all.filter(v => v.lang && v.lang.replace("_", "-").startsWith("en")).length;
  let started = false, finished = false, err = "";
  const u = new SpeechSynthesisUtterance("This is your phone's voice. If you can hear this, it is working.");
  const v = settings.voice ? all.find(x => x.voiceURI === settings.voice) : null; if (v) { u.voice = v; u.lang = v.lang; } else u.lang = "en-US";
  u.rate = settings.rate;
  u.onstart = () => { started = true; show(); }; u.onend = () => { finished = true; show(); }; u.onerror = e => { err = e.error || "unknown"; show(); };
  window._testU = u;
  const show = () => {
    const info = ` (${all.length} voices, ${en} English)`;
    out.textContent = err ? `Result B: the phone refused to speak. Reason given: ${err}.${info}`
      : finished ? `Result C: the phone says it spoke the whole sentence. If you heard nothing, the phone is muting it: turn off silent mode and turn the volume up.${info}`
      : started ? `Speaking now…${info}`
      : `Result D: the phone accepted the request but never started speaking.${info}`;
  };
  out.textContent = "Testing…";
  speechSynthesis.speak(u);
  setTimeout(() => { if (!started && !err) show(); }, 3000);
});
$("voice").addEventListener("change", e => { settings.voice = e.target.value; store.set("voice", settings.voice); });

function fillVoices() {
  if (!("speechSynthesis" in window)) return;
  const vs = speechSynthesis.getVoices().filter(v => v.lang && v.lang.startsWith("en"));
  const sel = $("voice");
  sel.innerHTML = '<option value="">Phone default</option>' +
    vs.map(v => `<option value="${v.voiceURI.replace(/"/g, "&quot;")}">${v.name} (${v.lang})</option>`).join("");
  sel.value = vs.some(v => v.voiceURI === settings.voice) ? settings.voice : "";
}
if ("speechSynthesis" in window) { fillVoices(); speechSynthesis.onvoiceschanged = fillVoices; }

// If the app was left open overnight, jump to the new day when it comes back
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && !playing && !manualDay && !sameDay(current, new Date())) goTo(new Date());
});

renderSettings(); render(); setButton();
</script>
</body>
</html>
